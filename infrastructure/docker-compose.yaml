version: '3.9'
services:
  wallet-db:
    image: postgres:18.6
    container_name: wallet-db
    environment:
      - TZ=UTC
      - POSTGRES_USER=gabriel
      - POSTGRES_PASSWORD=gabriel
      - POSTGRES_DB=wallet-dev
    ports:
      - 5000:5432
    volumes:
      - ./db-data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

networks:
  backend:
    driver: bridge